<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Namat social preview</title>
  <desc id="description">Namat logo with the message Native Go templates for Word</desc>
  <defs>
    <linearGradient id="background" x1="78" y1="40" x2="1202" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102846"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(235 315) rotate(8) scale(430 405)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00B6C2" stop-opacity=".15"/>
      <stop offset="1" stop-color="#00B6C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pattern" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 40h80M40 0v80" fill="none" stroke="#9ADFE3" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <rect width="1280" height="640" rx="32" fill="url(#glow)"/>
  <rect width="1280" height="640" rx="32" fill="url(#pattern)"/>
  <rect x="24" y="24" width="1232" height="592" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>

  <image href="namat-logo-dark.png" xlink:href="namat-logo-dark.png" x="110" y="104" width="1060" height="326" preserveAspectRatio="xMidYMid meet"/>
  <text x="640" y="490" text-anchor="middle" fill="#BAC7D8" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing=".5">Native Go templates for Word</text>
  <circle cx="496" cy="550" r="4" fill="#FEC33A"/>
  <text x="516" y="557" fill="#6FE1E6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">PURE GO</text>
  <circle cx="644" cy="550" r="4" fill="#FEC33A"/>
  <text x="664" y="557" fill="#8FA5BF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">DOCX · DOCM · OOXML</text>
</svg>
