name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -shuffle=on -count=3 ./...
      - name: Enforce library coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          check_coverage() {
            package="$1"
            minimum="$2"
            profile="$3"
            go test -coverprofile="$profile" "$package"
            coverage="$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
            awk -v coverage="$coverage" -v minimum="$minimum" 'BEGIN {
              if (coverage + 0 < minimum + 0) {
                printf "Coverage %.1f%% is below %.1f%%\n", coverage, minimum
                exit 1
              }
            }'
          }
          check_coverage . 80 coverage-root.out
          check_coverage ./internal/expr 75 coverage-expr.out
          check_coverage ./cmd/namat 55 coverage-cli.out
      - name: Reject product-specific test data
        shell: bash
        run: |
          if git grep -n -I -E 'OEG|data\.gov\.sa/oe|ODOE[0-9]+' -- '*_test.go' 'testdata/**'; then
            echo 'Product-specific identifiers are not allowed in Namat tests.'
            exit 1
          fi

  race-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz=FuzzParseCommand -fuzztime=10s .
      - run: go test -run '^$' -fuzz=FuzzCompileAndEvaluate -fuzztime=10s ./internal/expr
