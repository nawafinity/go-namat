name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -shuffle=on -count=3 ./...
      - name: Enforce library coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go test -coverprofile=coverage.out .
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN {
            if (coverage + 0 < 75) {
              printf "Library coverage %.1f%% is below 75%%\n", coverage
              exit 1
            }
          }'
      - name: Reject product-specific test data
        shell: bash
        run: |
          if git grep -n -I -E 'OEG|data\.gov\.sa/oe|ODOE[0-9]+' -- '*_test.go' 'testdata/**'; then
            echo 'Product-specific identifiers are not allowed in Namat tests.'
            exit 1
          fi

  race-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz=FuzzParseCommand -fuzztime=10s .
      - run: go test -run '^$' -fuzz=FuzzCompileAndEvaluate -fuzztime=10s ./internal/expr
