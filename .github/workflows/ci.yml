name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.23.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -shuffle=on -count=3 ./...
      - name: Enforce library coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        shell: bash
        run: |
          check_coverage() {
            package="$1"
            minimum="$2"
            profile="$3"
            go test -coverprofile="$profile" "$package"
            coverage="$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
            awk -v coverage="$coverage" -v minimum="$minimum" 'BEGIN {
              if (coverage + 0 < minimum + 0) {
                printf "Coverage %.1f%% is below %.1f%%\n", coverage, minimum
                exit 1
              }
            }'
          }
          check_coverage . 85 coverage-root.out
          check_coverage ./internal/engine 90 coverage-engine.out
          check_coverage ./internal/expr 70 coverage-expr.out
          check_coverage ./internal/value 95 coverage-value.out
          check_coverage ./cmd/namat 90 coverage-cli.out
          check_coverage ./examples/complete 100 coverage-example.out
      - name: Reject product-specific test data
        shell: bash
        run: |
          if git grep -n -I -E 'OEG|data\.gov\.sa/oe|ODOE[0-9]+' -- '*_test.go' ':(glob)**/testdata/**'; then
            echo 'Product-specific identifiers are not allowed in Namat tests.'
            exit 1
          fi

  race-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz=FuzzParseCommand -fuzztime=10s ./internal/engine
      - run: go test -run '^$' -fuzz=FuzzReadPackage -fuzztime=10s ./internal/engine
      - run: go test -run '^$' -fuzz=FuzzRenderCommandText -fuzztime=10s ./internal/engine
      - run: go test -run '^$' -fuzz=FuzzRenderLimits -fuzztime=10s ./internal/engine
      - run: go test -run '^$' -fuzz=FuzzCompileAndEvaluate -fuzztime=10s ./internal/expr

  libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libreoffice-writer
      - name: Convert public compatibility fixture
        env:
          NAMAT_REQUIRE_LIBREOFFICE: "1"
        run: go test -run '^TestLibreOfficeConvertsCompatibilityFixture$' -count=1 ./internal/engine
